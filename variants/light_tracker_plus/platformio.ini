[env:light-tracker-plus]
extends = esp32s3_base

; light_tracker_plus_v1 board JSON'ı sisteme kurulmadığında
; "esp32s3box" gibi bilinen bir S3 board'u fallback olarak kullanıyoruz.
; Tüm board parametreleri aşağıda elle tanımlanmıştır, board satırı
; sadece toolchain seçimi için gereklidir.
board = esp32s3box

; pins_arduino.h'ın bulunacağı variant klasörünü açıkça belirt.
; Bu olmadan esp32-hal-gpio.h pins_arduino.h'ı bulamaz.
board_build.variant         = light_tracker_plus_v1
board_build.variants_dir    = $PROJECT_DIR/arduino-core/variants

build_flags =
    ${esp32s3_base.build_flags}
    -D PRIVATE_HW
    -D ARDUINO_LightTracker_Plus
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D USB_VID=0x303A
    -D USB_PID=0x81E0
    -I variants/light_tracker_plus

; Board donanım parametreleri (JSON'dan elle alındı)
board_build.mcu             = esp32s3
board_build.f_cpu           = 240000000L
board_build.flash_mode      = qio
board_build.f_flash         = 80000000L
board_build.flash_size      = 8MB
board_build.partitions      = default_8MB.csv

upload_speed                        = 460800
board_upload.use_1200bps_touch      = true
board_upload.wait_for_upload_port   = true
board_upload.require_upload_port    = true

monitor_filters = esp32_exception_decoder
