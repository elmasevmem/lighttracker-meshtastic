name: Build Meshtastic Firmware - LightTracker Plus

on:
  push:
    branches: [ main, master ]
    paths:
      - 'variants/light_tracker_plus/**'
      - 'arduino-core/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest

    steps:
      # 1. Kendi reponu çek
      - name: Checkout variant repo
        uses: actions/checkout@v4
        with:
          path: variant-repo

      # 2. Meshtastic firmware'i çek
      - name: Checkout Meshtastic firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: master
          path: firmware
          submodules: recursive

      # 3. Board JSON'ını PlatformIO boards klasörüne koy
      - name: Install board JSON
        run: |
          mkdir -p ~/.platformio/boards
          cp variant-repo/boards/light_tracker_plus_v1.json ~/.platformio/boards/

      # 4. PlatformIO kur.
      #    pins_arduino.h artık repo içinde
      #    arduino-core/variants/light_tracker_plus_v1/ altında duruyor.
      #    platformio.ini'deki board_build.variants_dir bu klasörü gösteriyor,
      #    framework'e elle kopyalamaya gerek yok.
      - name: Install PlatformIO
        run: pip install platformio

      # 5. Variant dosyalarını firmware reposuna koy.
      #    platformio.ini'deki $PROJECT_DIR firmware/ klasörünü gösterecek,
      #    bu yüzden arduino-core klasörünü de oraya taşı.
      - name: Copy variant and arduino-core files into firmware
        run: |
          mkdir -p firmware/variants/light_tracker_plus
          cp variant-repo/variants/light_tracker_plus/variant.h     firmware/variants/light_tracker_plus/
          cp variant-repo/variants/light_tracker_plus/platformio.ini firmware/variants/light_tracker_plus/

          # arduino-core/variants/ → firmware içine kopyala
          # platformio.ini: board_build.variants_dir = $PROJECT_DIR/arduino-core/variants
          mkdir -p firmware/arduino-core/variants/light_tracker_plus_v1
          cp variant-repo/arduino-core/variants/light_tracker_plus_v1/pins_arduino.h \
             firmware/arduino-core/variants/light_tracker_plus_v1/

      # 6. Derle
      - name: Build firmware
        run: |
          cd firmware
          pio run -e light-tracker-plus

      # 7. Artifact olarak kaydet
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighttracker-plus-meshtastic-firmware
          path: |
            firmware/.pio/build/light-tracker-plus/firmware.bin
            firmware/.pio/build/light-tracker-plus/firmware.elf
          retention-days: 30

      # 8. Tag'li push'larda otomatik Release oluştur
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/.pio/build/light-tracker-plus/firmware.bin
          name: "LightTracker Plus Meshtastic ${{ github.ref_name }}"
          body: |
            LightTracker Plus v1.0 için Meshtastic firmware derlemesi.

            **Flash etmek için:**
            ```
            esptool.py --chip esp32s3 --port /dev/ttyACM0 \
              --baud 460800 write_flash 0x0 firmware.bin
            ```
            Veya [Meshtastic Web Flasher](https://flasher.meshtastic.org) ile custom firmware seçeneğini kullan.
